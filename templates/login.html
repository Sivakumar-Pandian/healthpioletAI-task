<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HealthPilot Ops</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    paper: '#EFF1EA',
                    ink: '#171A1D',
                    amber: '#A6642A',
                    statusGreen: '#2F6845',
                    statusRed: '#9B3A2E',
                    statusGrey: '#8A8F87',
                },
                fontFamily: {
                    serif: ['"Source Serif 4"', 'serif'],
                    sans: ['"IBM Plex Sans"', 'sans-serif'],
                    mono: ['"IBM Plex Mono"', 'monospace'],
                },
                borderRadius: { DEFAULT: '2px', lg: '2px', xl: '2px' },
            }
        }
    }
    </script>
</head>
<body class="bg-paper text-ink font-sans flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white border border-gray-300 shadow-md p-8">
        <div class="text-center mb-6">
            <h1 class="font-serif text-3xl font-bold text-ink">HealthPilot Ops</h1>
            <p class="text-xs uppercase tracking-widest text-gray-500 mt-1 font-mono">Healthcare Supply Chain ERP</p>
        </div>

        {% if error %}
        <div class="bg-statusRed/10 border border-statusRed text-statusRed px-4 py-3 mb-6 text-sm">
            {{ error }}
        </div>
        {% endif %}

        {% if request.query_params.get('success') %}
        <div class="bg-statusGreen/10 border border-statusGreen text-statusGreen px-4 py-3 mb-6 text-sm">
            {{ request.query_params.get('success') }}
        </div>
        {% endif %}

        <form action="/login" method="post" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-mono font-medium text-gray-700 uppercase mb-1">Email Address</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="e.g. anita@healthpilot.org"
                       class="w-full border border-gray-400 px-3 py-2 text-ink bg-paper focus:bg-white focus:border-amber focus:outline-none">
            </div>

            <div>
                <label for="password" class="block text-xs font-mono font-medium text-gray-700 uppercase mb-1">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                       class="w-full border border-gray-400 px-3 py-2 text-ink bg-paper focus:bg-white focus:border-amber focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-ink text-paper py-3 font-semibold hover:bg-amber transition-colors mt-2">
                Sign In
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-200 text-center">
            <p class="text-sm text-gray-600">
                Don't have an account? 
                <a href="/signup" class="text-amber font-semibold hover:underline">Sign up for your organization</a>
            </p>
        </div>

        <div class="mt-6 bg-slate-50 p-4 border border-gray-200 rounded text-xs font-mono text-gray-700 space-y-2">
            <p class="font-bold text-gray-900 uppercase tracking-wider mb-2">⚡ 1-Click Quick Demo Login:</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button type="button" onclick="quickLogin('anita@healthpilot.org')" class="px-2.5 py-1.5 bg-white border border-gray-300 rounded hover:border-amber-600 hover:text-amber-700 text-left font-sans transition-colors shadow-sm">
                    <div class="font-semibold text-slate-900">Anita Rao</div>
                    <div class="text-[10px] text-slate-500 font-mono">Branch A Staff</div>
                </button>
                <button type="button" onclick="quickLogin('karthik@healthpilot.org')" class="px-2.5 py-1.5 bg-white border border-gray-300 rounded hover:border-amber-600 hover:text-amber-700 text-left font-sans transition-colors shadow-sm">
                    <div class="font-semibold text-slate-900">Karthik Iyer</div>
                    <div class="text-[10px] text-slate-500 font-mono">Branch B Staff</div>
                </button>
                <button type="button" onclick="quickLogin('meena@healthpilot.org')" class="px-2.5 py-1.5 bg-white border border-gray-300 rounded hover:border-amber-600 hover:text-amber-700 text-left font-sans transition-colors shadow-sm">
                    <div class="font-semibold text-slate-900">Meena Pillai</div>
                    <div class="text-[10px] text-slate-500 font-mono">Central Purchasing</div>
                </button>
                <button type="button" onclick="quickLogin('rahul@healthpilot.org')" class="px-2.5 py-1.5 bg-white border border-gray-300 rounded hover:border-amber-600 hover:text-amber-700 text-left font-sans transition-colors shadow-sm">
                    <div class="font-semibold text-slate-900">Rahul Dev</div>
                    <div class="text-[10px] text-slate-500 font-mono">Receiving Staff</div>
                </button>
            </div>
        </div>
    </div>
    <script>
    function quickLogin(email) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = 'password123';
        document.querySelector('form[action="/login"]').submit();
    }
    </script>
</body>
</html>
