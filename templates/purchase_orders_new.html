{% extends "base.html" %}

{% block content %}
<h1 class="font-serif text-2xl mb-2">New Purchase Order</h1>
<p class="text-gray-600 mb-6">From requisition <span class="font-mono">{{ requisition.document_no }}</span></p>

<form action="/purchase-orders/new" method="post" class="max-w-xl space-y-5">
    <input type="hidden" name="requisition_id" value="{{ requisition.id }}">

    <div class="grid grid-cols-2 gap-4 border-y border-ink py-4 text-sm">
        <div><span class="block text-gray-600">Product</span>{{ requisition.product.name }}</div>
        <div><span class="block text-gray-600">Quantity</span><span id="quantity">{{ requisition.quantity }}</span></div>
    </div>

    <label class="block text-sm">
        <span class="block mb-1">Supplier</span>
        <select name="supplier_id" class="w-full border border-ink px-3 py-2 bg-paper" required>
            {% for supplier in suppliers %}
            <option value="{{ supplier.id }}">{{ supplier.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label class="block text-sm">
        <span class="block mb-1">Unit Price</span>
        <input id="unit-price" name="unit_price" type="number" min="0" step="0.01" class="w-full border border-ink px-3 py-2 bg-paper" value="{{ requisition.product.purchase_price }}" required>
    </label>

    <label class="block text-sm">
        <span class="block mb-1">Tax Percent</span>
        <input id="tax-percent" name="tax_percent" type="number" min="0" step="0.01" class="w-full border border-ink px-3 py-2 bg-paper" value="{{ requisition.product.tax_percent }}" required>
    </label>

    <label class="block text-sm">
        <span class="block mb-1">Delivery Location</span>
        <select name="delivery_location_id" class="w-full border border-ink px-3 py-2 bg-paper" required>
            {% for location in locations %}
            <option value="{{ location.id }}" {% if location.id == requisition.location_id %}selected{% endif %}>{{ location.name }}</option>
            {% endfor %}
        </select>
    </label>

    <dl class="border-y border-ink py-3 text-sm space-y-2">
        <div class="flex justify-between"><dt>Value Before Tax</dt><dd id="value-before-tax">₹0.00</dd></div>
        <div class="flex justify-between"><dt>Tax Amount</dt><dd id="tax-amount">₹0.00</dd></div>
        <div class="flex justify-between font-medium"><dt>Total Value</dt><dd id="total-value">₹0.00</dd></div>
    </dl>

    <button type="submit" class="bg-ink text-white px-4 py-2 text-sm">Create Purchase Order</button>
</form>

<script>
const quantity = Number(document.getElementById('quantity').textContent);
const unitPrice = document.getElementById('unit-price');
const taxPercent = document.getElementById('tax-percent');
const currency = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' });

function updateTotals() {
    const valueBeforeTax = quantity * (Number(unitPrice.value) || 0);
    const taxAmount = valueBeforeTax * (Number(taxPercent.value) || 0) / 100;
    document.getElementById('value-before-tax').textContent = currency.format(valueBeforeTax);
    document.getElementById('tax-amount').textContent = currency.format(taxAmount);
    document.getElementById('total-value').textContent = currency.format(valueBeforeTax + taxAmount);
}

unitPrice.addEventListener('input', updateTotals);
taxPercent.addEventListener('input', updateTotals);
updateTotals();
</script>
{% endblock %}
